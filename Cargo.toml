[package]
name = "stella24"
version = "0.1.0"
authors = ["Filip Furár <furar@stud.uniza.sk>"]
edition = "2024"
include = ["LICENSE-APACHE", "LICENSE-MIT", "**/*.rs", "Cargo.toml"]
resolver = "2"
rust-version = "1.93.1"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[dependencies]
egui = { version = "0.33.3", default-features = false, features = ["color-hex"] }
egui_extras = { version = "0.33.3", features = ["syntect", "image", "svg"] }
log = "0.4.29"
svg = "0.18"

# You only need serde if you want app persistence:
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
slotmap = { version = "1.1.1", features = ["serde"] }

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
rfd = "0.17.2"
gethostname = "1.0.1"
eframe = { version = "0.33.3", default-features = false, features = [
    "default_fonts", # Embed the default egui fonts.
    "glow",          # Use the glow rendering backend. Alternative: "wgpu".
    "persistence",   # Enable restoring app state when restarting the app.
    "wayland",       # To support Linux (and CI)
] }

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.33.3", default-features = false, features = [
    "default_fonts", # Embed the default egui fonts.
    "glow",          # Use the glow rendering backend. Alternative: "wgpu".
    "persistence",   # Enable restoring app state when restarting the app.
] }
wasm-bindgen-futures = "0.4"
web-sys = "0.3.70"           # to access the DOM (to hide the loading text)

[profile.release]
opt-level = 2 # fast and small wasm

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
egui_kittest = "0.33.0"

[features]
default = []
native-accesskit = ["eframe/accesskit"]

[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }

